name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and release lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release lint
        run: ./gradlew --no-daemon lintRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

  release:
    name: Signed release APK and AAB
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_TOOLS: '36.0.0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode PKCS12 keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Release builds are never debug-signed."
            exit 1
          fi
          KS="$RUNNER_TEMP/release-keystore.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature (apksigner)
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed APK not found (unsigned output means signing failed)"; ls -R app/build/outputs/apk; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-certs.txt
          if grep -q "CN=Android Debug" apk-certs.txt; then
            echo "::error::APK is signed with the Android debug certificate"; exit 1
          fi

      - name: Verify AAB signature (jarsigner) and expected signer
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::AAB not found"; exit 1; }
          # A self-signed upload certificate is normal; only integrity and signer identity are checked.
          jarsigner -verify -strict "$AAB" > aab-verify.txt 2>&1 || true
          cat aab-verify.txt
          grep -q "jar verified" aab-verify.txt || { echo "::error::AAB signature verification failed"; exit 1; }
          if grep -qE "unsigned|not signed" aab-verify.txt; then echo "::error::AAB has unsigned entries"; exit 1; fi
          AAB_SHA=$(keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:" | awk '{print $2}')
          KS_SHA=$(keytool -list -v -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | grep -m1 "SHA256:" | awk '{print $2}')
          echo "AAB signer SHA-256:      $AAB_SHA"
          echo "Keystore cert SHA-256:   $KS_SHA"
          if [ -z "$AAB_SHA" ] || [ "$AAB_SHA" != "$KS_SHA" ]; then
            echo "::error::AAB signer does not match the release keystore"; exit 1
          fi
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::AAB is signed with the Android debug certificate"; exit 1
          fi

      - name: Check release permissions
        run: |
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"
          APK=app/build/outputs/apk/release/app-release.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          # AndroidX core declares a signature-level, app-scoped receiver permission; that one is allowed.
          UNEXPECTED=$(grep -E "^uses-permission" permissions.txt | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected permissions in release APK:"; echo "$UNEXPECTED"; exit 1
          fi
          if grep -qE "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "::error::Network permission found"; exit 1
          fi
          echo "Release APK requests no runtime or network permissions."

      - name: Check native libraries and 16 KB alignment
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          SO_APK=$(unzip -Z1 "$APK" | grep -E '\.so$' || true)
          SO_AAB=$(unzip -Z1 "$AAB" | grep -E '\.so$' || true)
          if [ -z "$SO_APK" ] && [ -z "$SO_AAB" ]; then
            echo "No native .so libraries are packaged in the APK or AAB (16 KB ELF alignment not applicable)." | tee native-libs.txt
          else
            echo "Native libraries found:" | tee native-libs.txt
            echo "$SO_APK" "$SO_AAB" | tee -a native-libs.txt
            "$ZIPALIGN" -c -P 16 -v 4 "$APK"
            mkdir -p so && cd so && unzip -o -q "../$APK" 'lib/*'
            FAIL=0
            for f in $(find . -name '*.so'); do
              for a in $(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}'); do
                if [ $((a)) -lt 16384 ]; then echo "::error::$f LOAD segment alignment $a < 16 KB"; FAIL=1; fi
              done
            done
            exit $FAIL
          fi

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fractionbuddy-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            apk-certs.txt
            aab-verify.txt
            permissions.txt
            native-libs.txt
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.p12"
